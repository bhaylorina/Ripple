name: Build Ripple APK

on:
  push:
    branches: [ "main" ] # Agar aapki branch ka naam master hai toh "master" likhna
  workflow_dispatch: # Ye aapko manual run karne ka button dega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build APK
      run: |
        # Ye command automatically aapke liye Gradle set karegi aur APK banayegi
        gradle wrapper --gradle-version 8.4
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ripple-IPTV-App
        path: app/build/outputs/apk/debug/app-debug.apk
